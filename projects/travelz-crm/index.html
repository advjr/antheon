<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travelz CRM · Demo</title>
  <meta name="description" content="Demo of a travel CRM for a small-group tour company in Australia: bookings, enquiries, departures, travellers, inbox and insights on one screen. Sample data only.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="wrap" id="top">

    <header class="top">
      <a class="brand" href="#top" aria-label="Travelz, back to the top">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.6 10.6 20.3 3.2c.9-.4 1.8.5 1.4 1.4l-7.4 17.7c-.4.9-1.7.9-2 0l-2.3-6.6-6.6-2.3c-.9-.3-.9-1.6 0-2z"/></svg></span>
        Travelz <span class="demo-pill">Demo</span>
      </a>
      <div class="team" id="team" aria-label="Team"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
      <div class="tools">
        <button type="button" class="tour-btn" id="tourBtn" aria-label="Take the tour"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Take the tour</span></button>
        <button type="button" class="icon-btn" id="bellBtn" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="dot"></span></button>
        <span class="me" id="me"></span>
      </div>
    </header>

    <p class="sample"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span><b>Sample data.</b> Travelz is a fictional small-group tour company in Melbourne, Australia. All amounts are in Australian dollars.</span></p>

    <main>
      <section class="view" id="v-overview" data-view="overview"></section>
      <section class="view" id="v-pipeline" data-view="pipeline" hidden></section>
      <section class="view" id="v-departures" data-view="departures" hidden></section>
      <section class="view" id="v-travellers" data-view="travellers" hidden></section>
      <section class="view" id="v-inbox" data-view="inbox" hidden></section>
      <section class="view" id="v-insights" data-view="insights" hidden></section>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawerTitle">
    <div class="drawer-h"><h2 id="drawerTitle"></h2><button type="button" class="icon-btn" id="drawerClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="drawer-b" id="drawerBody"></div>
    <div class="drawer-f" id="drawerFoot"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/tour.js"></script>
</body>
</html>
